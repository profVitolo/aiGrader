[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "aigrader"
version = "0.1.0"
description = "Correzione automatica di compiti scolastici con LLM"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
aigrader = "main:main"
