[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aigrader"
version = "1.0.0"
description = "AiGrader - Correzione automatica di compiti scolastici con LLM"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
include = ["config*", "converters*", "utils*"]
